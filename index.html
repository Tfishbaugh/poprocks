<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>PopRocks</title>
  <meta name="description" content="Make a beat. Make a music video.">
  <meta name="theme-color" content="#FFF7EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15111F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PopRocks">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <section id="start" class="screen start" aria-labelledby="start-title">
    <img class="start-icon" src="icons/icon.svg" alt="" width="128" height="128">
    <h1 id="start-title" class="start-title">PopRocks</h1>
    <p class="start-tag">Make a beat. Make a music video.</p>
    <button id="start-btn" class="btn btn-play btn-big" type="button">
      <span class="ico" aria-hidden="true">▶&#xFE0E;</span><span class="lbl">Tap to start</span>
    </button>
    <p id="start-note" class="note" hidden></p>
  </section>

  <section id="beats" class="screen beats" aria-label="Beats" hidden>
    <header class="top">
      <h1 class="logo"><img src="icons/icon.svg" alt="" width="32" height="32"><span>PopRocks</span></h1>
      <div id="slots" class="slots" role="group" aria-label="Choose a beat">
        <button class="slot" type="button" data-slot="0" aria-label="Beat 1">1</button>
        <button class="slot" type="button" data-slot="1" aria-label="Beat 2">2</button>
        <button class="slot" type="button" data-slot="2" aria-label="Beat 3">3</button>
        <button class="slot" type="button" data-slot="3" aria-label="Beat 4">4</button>
      </div>
      <!-- Sound kits (task 80, lane B): shows this beat's kit and opens the picker. -->
      <button id="sounds" class="btn kit-btn" type="button" aria-haspopup="dialog" aria-label="Sounds: Party"><span class="ico" aria-hidden="true">🎉</span><span class="lbl">Party</span></button>
    </header>

    <!-- Longer beats: move along the strip, see where you are, make it longer. -->
    <div id="strip-nav" class="strip-nav" role="group" aria-label="Move along the beat">
      <button id="strip-back" class="btn tool nav-btn" type="button" aria-controls="grid-wrap"><span class="ico" aria-hidden="true">❮</span><span class="lbl">Back</span></button>
      <div id="strip-map" class="strip-map" aria-hidden="true">
        <div id="strip-view" class="strip-view"></div>
        <div id="strip-dot" class="strip-dot" hidden></div>
      </div>
      <button id="strip-next" class="btn tool nav-btn" type="button" aria-controls="grid-wrap"><span class="ico" aria-hidden="true">❯</span><span class="lbl">Next</span></button>
      <button id="longer" class="btn tool longer" type="button"><span class="ico" aria-hidden="true">➕</span><span class="lbl">Longer</span></button>
    </div>

    <div class="grid-wrap" id="grid-wrap">
      <div id="grid" class="grid" role="group" aria-label="Beat pads"></div>
    </div>

    <footer class="bar-wrap">
      <div id="bar" class="bar">
        <div id="tools" class="tools">
          <div class="tool-group" role="group" aria-label="Speed">
            <button id="slower" class="btn tool" type="button"><span class="ico" aria-hidden="true">🐢</span><span class="lbl">Slower</span></button>
            <output id="bpm" class="tool speed" aria-live="polite"><span class="num">100</span><span class="lbl">Speed</span></output>
            <button id="faster" class="btn tool" type="button"><span class="ico" aria-hidden="true">🐇</span><span class="lbl">Faster</span></button>
          </div>
          <div class="tool-group" role="group" aria-label="Beat">
            <button id="surprise" class="btn tool" type="button"><span class="ico" aria-hidden="true">🎲</span><span class="lbl">Surprise</span></button>
            <button id="clear" class="btn tool" type="button"><span class="ico" aria-hidden="true">🧽</span><span class="lbl">Clear</span></button>
            <button id="undo" class="btn tool" type="button"><span class="ico" aria-hidden="true">↩</span><span class="lbl">Undo</span></button>
            <button id="double" class="btn tool" type="button"><span class="ico" aria-hidden="true">×2</span><span class="lbl">Double</span></button>
            <button id="copy" class="btn tool" type="button" aria-haspopup="dialog"><span class="ico" aria-hidden="true">📋</span><span class="lbl">Copy</span></button>
            <button id="shorter" class="btn tool" type="button"><span class="ico" aria-hidden="true">✂️</span><span class="lbl">Shorter</span></button>
            <button id="longer-tool" class="btn tool rail-only" type="button"><span class="ico" aria-hidden="true">➕</span><span class="lbl">Longer</span></button>
          </div>
          <!-- Sound kits (task 80, lane B): on a phone on its side, Sounds lives here, not in the rail. -->
          <button id="sounds-tool" class="btn tool rail-only" type="button" aria-haspopup="dialog" aria-label="Sounds: Party"><span class="ico" aria-hidden="true">🎉</span><span class="lbl">Sounds</span></button>
          <button id="last-video" class="btn tool" type="button" hidden><span class="ico" aria-hidden="true">🎬</span><span class="lbl">My video</span></button>
          <button id="help" class="btn tool" type="button"><span class="ico" aria-hidden="true">❓</span><span class="lbl">Help</span></button>
        </div>
        <button id="more" class="btn tool more" type="button" aria-expanded="false" aria-controls="tools"><span class="ico" aria-hidden="true">⋯</span><span class="lbl">More</span></button>
        <button id="play" class="btn btn-play" type="button"><span class="ico" aria-hidden="true">▶&#xFE0E;</span><span class="lbl">Play</span></button>
        <button id="make-video" class="btn btn-video" type="button"><span class="ico" aria-hidden="true">🎥</span><span class="lbl">Make video</span></button>
      </div>
    </footer>
  </section>

  <section id="record" class="screen dark record" aria-label="Make a video" hidden>
    <video id="preview" class="preview" muted playsinline autoplay></video>
    <div class="corner top-left">
      <button id="rec-close" class="btn chip" type="button"><span class="ico" aria-hidden="true">✕</span><span class="lbl">Close</span></button>
    </div>
    <div class="corner top-right">
      <button id="mic" class="btn chip" type="button" aria-pressed="true" aria-label="Mic"><span class="ico" aria-hidden="true">🎤</span><span class="lbl">Mic on</span></button>
    </div>
    <div id="rec-card" class="card" role="status">
      <p id="rec-msg">Allow the camera to film yourself.</p>
      <p id="rec-code" class="code" hidden></p>
      <button id="rec-retry" class="btn btn-video" type="button" hidden><span class="ico" aria-hidden="true">🎥</span><span class="lbl">Turn on camera</span></button>
    </div>
    <div id="countdown" class="countdown" aria-live="assertive"></div>
    <div class="corner bottom-right rec-ctl">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="54"></circle>
        <circle id="ring-left" class="ring-left" cx="60" cy="60" r="54"></circle>
      </svg>
      <button id="rec-btn" class="rec-btn" type="button" disabled><span class="ico" aria-hidden="true"></span><span class="lbl">Record</span></button>
      <span id="rec-time" class="rec-time" hidden></span>
    </div>
  </section>

  <section id="watch" class="screen dark watch" aria-label="Watch your video" hidden>
    <div class="watch-top">
      <button id="watch-back" class="btn chip" type="button"><span class="ico" aria-hidden="true">←</span><span class="lbl">Beats</span></button>
      <button id="watch-delete" class="btn chip" type="button"><span class="ico" aria-hidden="true">🗑</span><span class="lbl">Delete</span></button>
    </div>
    <video id="playback" class="playback" controls playsinline></video>
    <p id="watch-note" class="note" hidden></p>
    <div class="watch-bottom">
      <button id="watch-again" class="btn chip" type="button"><span class="ico" aria-hidden="true">🔁</span><span class="lbl">Again</span></button>
      <button id="watch-save" class="btn btn-video btn-big" type="button"><span class="ico" aria-hidden="true">💾</span><span class="lbl">Save</span></button>
    </div>
  </section>

  <!-- Sound kits (task 80, lane B): js/kits.js fills in the cards and the credit line. -->
  <dialog id="kits" class="kits" aria-labelledby="kits-title">
    <div class="kits-card">
      <div class="kits-head">
        <h2 id="kits-title">Sounds</h2>
        <button id="kits-close" class="btn tool kits-close" type="button"><span class="ico" aria-hidden="true">✕</span><span class="lbl">Close</span></button>
      </div>
      <div class="kit-cards" role="group" aria-labelledby="kits-title"></div>
      <p class="kit-credit"></p>
    </div>
  </dialog>

  <!-- 📋 Copy: a whole beat to another number, or one sound's row onto another sound. -->
  <div id="copy-sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="copy-title">
      <div class="sheet-head">
        <h2 id="copy-title">Copy</h2>
        <button id="copy-close" class="btn tool" type="button"><span class="ico" aria-hidden="true">✕</span><span class="lbl">Close</span></button>
      </div>
      <h3 class="sheet-sub">Copy this beat to</h3>
      <div id="copy-slots" class="copy-slots"></div>
      <h3 id="copy-row-title" class="sheet-sub">Copy a sound</h3>
      <div id="copy-sounds" class="copy-sounds" role="group" aria-labelledby="copy-row-title"></div>
    </div>
  </div>

  <p id="sr-status" class="sr-only" aria-live="polite"></p>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-action" class="btn toast-action" type="button" hidden></button>
  </div>

  <noscript><p class="note">PopRocks needs JavaScript turned on.</p></noscript>
</body>
</html>
